PackageName: Gatelane
License: Apache-2.0
ShortDescription: Pre-production safety + eval gate for AI agents. Captures live LLM traffic, freezes it into reproducible datasets, replays against candidate models, and auto-promotes or rolls back based on a configurable quality threshold.
Description: |
  gatelane is the pre-production safety + eval gate for AI agents. One CLI, two commands:

    gatelane gate — replay a dataset against candidate models, score with an LLM judge, compare
    against a baseline, and emit a signed promotion report. If the candidate meets the threshold
    the run is allowed; else it is blocked.

    gatelane freeze-slice — freeze a window of captured production traffic into a reproducible
    dataset that the gate can replay.

  Both commands share the same capture pipeline and promotion primitive. No other product ships
  a CI/CD-native gate that answers: "Is this new model/prompt/tool safe AND good enough to
  deploy?"

  The CLI needs Node.js 22 or newer at runtime.

  Distribution: gatelane ships as a single file via `winget install lanefoundry.gatelane`,
  as a Docker image via `docker run ghcr.io/lanefoundry/gatelane`, as npm packages
  `@lanefoundry/gatelane-sdk` / `@lanefoundry/gatelane-engine` / `@lanefoundry/gatelane-cli`,
  and as a Python package `pip install gatelane-sdk`. Source build: see
  https://github.com/lanefoundry/gatelane.
