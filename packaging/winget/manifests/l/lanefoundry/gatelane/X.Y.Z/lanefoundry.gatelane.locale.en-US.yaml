ShortDescription: Pre-production safety + eval gate for AI agents. Captures live LLM traffic, freezes it into reproducible datasets, replays against candidate models, and auto-promotes or rolls back based on configurable quality threshold.
Description: |
  gatelane is the pre-production safety + eval gate for AI agents. One CLI, two commands:

    gatelane scan — run security attack probes against a deployed agent and emit a vulnerability
    report with payload, evidence, and patch recommendations.

    gatelane eval — replay a frozen slice of production traffic against candidate models, score
    with an LLM judge, and emit a signed promotion report. If the candidate meets the threshold,
    route to canary; else auto-block.

  Both commands share the same capture pipeline and promotion primitive. No other product ships
  a CI/CD-native gate that answers: "Is this new model/prompt/tool safe AND good enough to
  deploy?"

  Distribution: gatelane ships as a single binary via `winget install lanefoundry.gatelane`,
  as a Docker image via `docker run ghcr.io/lanefoundry/gatelane`, as npm packages
  `@lanefoundry/gatelane-sdk` / `@lanefoundry/gatelane-engine` / `@lanefoundry/gatelane-cli`,
  and as a Python package `pip install gatelane-sdk`. Source build: see
  https://github.com/lanefoundry/gatelane.
