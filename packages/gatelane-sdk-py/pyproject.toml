[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "gatelane-sdk"
version = "0.0.1-dev"
description = "Capture SDK + type hints for the gatelane promotion gate."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "lanefoundry", email = "noreply@lanefoundry.dev" }]
keywords = ["ai", "agent", "eval", "redteam", "promotion", "gate", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1.0",
  "typing-extensions>=4.0; python_version < '3.10'",
]

[project.optional-dependencies]
# Sync transport via requests (use when async isn't appropriate, e.g. legacy agents).
sync = ["requests>=2.32,<3.0"]
# dev / CI
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",          # httpx mocking
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/lanefoundry/gatelane"
Documentation = "https://github.com/lanefoundry/gatelane/blob/main/docs/distribution.md"
Source = "https://github.com/lanefoundry/gatelane/tree/main/packages/gatelane-sdk-py"
Issues = "https://github.com/lanefoundry/gatelane/issues"
Changelog = "https://github.com/lanefoundry/gatelane/releases"

# Tell PyPI / mypy this package ships inline type annotations.
[tool.hatch.build.targets.wheel]
packages = ["src/gatelane_sdk"]
include = ["src/gatelane_sdk/py.typed"]

[tool.hatch.build.targets.sdist]
include = ["src/gatelane_sdk", "README.md", "LICENSE"]
exclude = ["tests/**", "**/.pytest_cache", ".github/**"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

# --- dev tooling ---------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
strict = true
files = ["src/gatelane_sdk"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

# Make hatchling include the py.typed marker so mypy / pyright pick up types.
[tool.hatch.build.targets.wheel.force-include]
"src/gatelane_sdk/py.typed" = "gatelane_sdk/py.typed"