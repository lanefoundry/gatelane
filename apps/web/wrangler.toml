name = "gatelane"
main = ".output/worker/_worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "gatelane"
database_id = ""  # paste after `wrangler d1 create gatelane`

[[r2_buckets]]
binding = "CAPTURES"
bucket_name = "gatelane-captures"

[[kv_namespaces]]
binding = "GATELANE_KV"
id = ""  # paste after `wrangler kv namespace create GATELANE_KV`
