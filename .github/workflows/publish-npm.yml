name: Publish npm (canary)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish this commit to npm under the canary dist-tag'
        type: boolean
        default: false

# Canary publishes to npm under the @canary dist-tag. Stable publishes
# happen from .github/workflows/release.yml on tag.
concurrency:
  group: npm-canary
  cancel-in-progress: false

permissions:
  contents: read
  # Required for npm's OIDC trusted publishing. The npm CLI exchanges
  # this short-lived token for a publish token; no long-lived npm
  # credential is involved.
  id-token: write

env:
  # Publish order matters: every package must land after the workspace
  # packages it depends on, otherwise `workspace:*` resolves to a version
  # that is not on the registry yet and the install fails with a 404.
  NPM_PACKAGE_DIRS: >-
    packages/gatelane-sdk
    packages/gatelane-engine
    packages/source-prod-slice
    packages/cli
    packages/ci-adapter

jobs:
  # Keep the "disabled" case visible. Previously every publish step was
  # gated with `if: vars.ENABLE_NPM_CANARY == 'true'`, so a run with the
  # variable unset looked green while publishing nothing at all.
  publish-disabled:
    name: Publish skipped (ENABLE_NPM_CANARY not set)
    if: vars.ENABLE_NPM_CANARY != 'true' && !inputs.publish
    runs-on: ubuntu-latest
    steps:
      - name: Warn
        run: |
          echo "::warning title=npm canary disabled::ENABLE_NPM_CANARY is not 'true' and this run was not dispatched with publish=true, so no package was published. Set the repository variable ENABLE_NPM_CANARY=true to enable canary publishing."

  publish-canary:
    name: Publish canary
    # Gate at the job level so a disabled publish shows up as "skipped" in
    # the run list instead of a green job with silently skipped steps.
    if: vars.ENABLE_NPM_CANARY == 'true' || inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: npm-canary
      url: https://www.npmjs.com/
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      # Node 24 is required: npm's OIDC trusted publishing needs npm
      # >= 11.5.1 and Node >= 22.14.0, and `npm dist-tag` over OIDC
      # needs npm >= 11.21.0.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
          # Never cache in a release build.
          package-manager-cache: false

      - name: Use an npm that supports OIDC
        run: npm install -g npm@^11.21.0

      # Fallback credentials for the window before the trusted publisher
      # is configured. Once it is set up, npm prefers the OIDC identity
      # and this secret can be deleted.
      #
      # The `secrets` context is not available in a step's `if`, so the
      # check happens in the shell.
      - name: Fallback token notice
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            echo "::notice::NPM_TOKEN is set; npm will use it unless an OIDC trusted publisher is configured."
          else
            echo "::notice::No NPM_TOKEN configured; publishing relies on the OIDC trusted publisher."
          fi

      - run: pnpm install --frozen-lockfile

      # Build every workspace package (topological order), not just the
      # ones we used to list. `files` only ships dist/, so a package that
      # is published without being built ships an empty tarball.
      - name: Build packages
        run: pnpm -r --filter "./packages/*" build

      - name: Stamp canary version
        run: |
          SHA="${GITHUB_SHA::7}"
          VERSION="0.0.0-canary-${SHA}"
          echo "Publishing version ${VERSION}"
          for pkg in $NPM_PACKAGE_DIRS; do
            node -e "const p=require('./${pkg}/package.json');p.version='${VERSION}';require('fs').writeFileSync('./${pkg}/package.json',JSON.stringify(p,null,2)+'\n');"
          done

      # `npm publish` publishes the manifest verbatim — it does not
      # rewrite `workspace:*` the way `pnpm publish` does. Resolve the
      # workspace ranges ourselves so the published manifest points at
      # real versions.
      - name: Resolve workspace dependencies
        run: node tools/resolve-workspace-deps.mjs

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA::7}"
          VERSION="0.0.0-canary-${SHA}"
          for pkg in $NPM_PACKAGE_DIRS; do
            name="$(node -p "require('./${pkg}/package.json').name")"
            echo "::group::publishing ${name}@${VERSION}"

            # Skip if this exact version is already on the registry. A
            # re-run after a transient failure must not die on
            # "cannot publish over the previously published versions".
            if [ "$(npm view "${name}@${VERSION}" version 2>/dev/null || true)" = "$VERSION" ]; then
              echo "${name}@${VERSION} is already published, skipping"
              echo "::endgroup::"
              continue
            fi

            # The npm registry returns 503 under load, which would
            # otherwise abort the whole release on a transient failure.
            attempt=1
            until (cd "$pkg" && npm publish --access public --tag canary --provenance); do
              if [ "$attempt" -ge 5 ]; then
                echo "::error::failed to publish ${name}@${VERSION} after ${attempt} attempts"
                exit 1
              fi
              echo "::warning::publishing ${name}@${VERSION} failed, retrying (${attempt}/5)"
              attempt=$((attempt + 1))
              sleep $((attempt * 20))
            done
            echo "::endgroup::"
          done

      # npm sets `latest` on the first publish of a package no matter which
      # tag was requested. Apply the tags explicitly so that
      # `npm i @lanefoundry/gatelane-sdk` resolves to something usable.
      #
      # This needs the "Allow npm dist-tag" option on the trusted
      # publisher, so a failure here is reported but does not fail the
      # release — the packages themselves are already published.
      - name: Apply dist-tags
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA::7}"
          VERSION="0.0.0-canary-${SHA}"
          for pkg in $NPM_PACKAGE_DIRS; do
            name="$(node -p "require('./${pkg}/package.json').name")"
            node tools/npm-dist-tags.mjs "$name" "$VERSION" canary \
              || echo "::warning::could not manage the dist-tags of ${name}; enable 'Allow npm dist-tag' on the trusted publisher"
          done

      # The registry answers a fresh publish with "Your package is being
      # processed and may take a few minutes to become available", so the
      # version is not readable immediately. Poll instead of failing on
      # the first 404.
      - name: Verify the packages are actually on the registry
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA::7}"
          VERSION="0.0.0-canary-${SHA}"
          for name in \
            @lanefoundry/gatelane-sdk \
            @lanefoundry/gatelane-engine \
            @lanefoundry/source-prod-slice \
            @lanefoundry/gatelane-cli \
            @lanefoundry/gatelane-ci-adapter; do
            published=""
            for attempt in $(seq 1 24); do
              published="$(npm view "${name}@${VERSION}" version 2>/dev/null || true)"
              [ "$published" = "$VERSION" ] && break
              echo "attempt ${attempt}: ${name}@${VERSION} is '${published}', waiting for the registry"
              sleep 15
            done
            echo "${name}@${VERSION} -> ${published}"
            if [ "$published" != "$VERSION" ]; then
              echo "::error::${name}@${VERSION} is ${published}, expected ${VERSION}"
              exit 1
            fi
            echo "${name} dist-tags: $(npm view "${name}" dist-tags --json 2>/dev/null || echo '{}')"
          done

  # Every push to main publishes an immutable canary version to five
  # packages, so the version list grows without bound. npm only allows
  # unpublishing within 72 hours of a publish, so this is a best-effort
  # cleanup of the recent ones.
  #
  # Unpublishing is not available over OIDC, so this job needs the
  # fallback token and is skipped when there is none.
  prune-canary:
    name: Prune old canary versions
    if: vars.ENABLE_NPM_CANARY == 'true' || inputs.publish
    needs: publish-canary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
          package-manager-cache: false

      - name: Use an npm that supports OIDC
        run: npm install -g npm@^11.21.0

      - name: Prune
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::notice::No NPM_TOKEN configured; skipping the canary cleanup. npm does not expose 'npm unpublish' over trusted publishing."
            exit 0
          fi
          node tools/prune-canary.mjs --keep 5
