name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0). Empty = dry-run on current HEAD.'
        required: false

# Tag-driven releases must be linear: prevent concurrent or tag-overwriting runs.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Permissions are granted per job, not workflow-wide. The build job only
# reads the repository; only the release job needs to write.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  # ----------------------------------------------------------------------
  # 1. Build all platform artifacts + Docker image, attach to GitHub Release
  # ----------------------------------------------------------------------
  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # cosign keyless signing of SHA256SUMS
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install + lint + typecheck + test
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test

      # Build every workspace package in topological order. Packages ship
      # only dist/, so anything not built here ends up as an empty tarball.
      - name: Build packages
        run: pnpm -r --filter "./packages/*" build

      - name: Build dashboard (static assets)
        run: pnpm --filter @lanefoundry/gatelane-dashboard build

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          # The version used everywhere is the tag without its leading "v".
          echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${TAG#v}"

      - name: Stamp version into package.json
        run: |
          VERSION="${{ steps.tag.outputs.value }}"
          for pkg in packages/gatelane-sdk packages/gatelane-engine packages/source-prod-slice packages/cli packages/ci-adapter; do
            node -e "const p=require('./${pkg}/package.json');p.version='${VERSION}';require('fs').writeFileSync('./${pkg}/package.json',JSON.stringify(p,null,2)+'\n');"
          done

      - name: Pack npm tarballs
        run: |
          mkdir -p artifacts
          for pkg in packages/gatelane-sdk packages/gatelane-engine packages/source-prod-slice packages/cli packages/ci-adapter; do
            (cd "$pkg" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/artifacts")
          done
          ls -la artifacts

      - name: Bundle CLI for each platform (linux/macos/windows x amd64/arm64)
        run: |
          set -euo pipefail
          mkdir -p artifacts/bin

          # Source map for matrix expansion. OS/arch naming follows GitHub Release convention.
          declare -a targets=(
            "linux:amd64"
            "linux:arm64"
            "darwin:amd64"
            "darwin:arm64"
            "windows:amd64"
          )

          for t in "${targets[@]}"; do
            IFS=":" read -r os arch <<< "$t"
            dir="artifacts/bin/gatelane-${os}-${arch}"
            mkdir -p "$dir"

            # esbuild bundles the workspace packages and their CJS
            # dependencies into one file. `pkg` was used here before, but
            # it cannot resolve subpath exports
            # (`@lanefoundry/gatelane-engine/attack`) and produced
            # binaries that threw at runtime.
            pnpm exec esbuild packages/cli/dist/cli.js \
              --bundle \
              --platform=node \
              --format=cjs \
              --target=node22 \
              --outfile="$dir/gatelane"

            # The bundle keeps the `#!/usr/bin/env node` shebang from
            # src/cli.ts, so it is directly executable.
            chmod +x "$dir/gatelane"

            if [ "$os" = "windows" ]; then
              printf '@echo off\r\nnode "%%~dp0gatelane" %%*\r\n' > "$dir/gatelane.cmd"
              (cd artifacts/bin && zip -r "gatelane-${os}-${arch}.zip" "gatelane-${os}-${arch}")
            else
              tar -C artifacts/bin -czf "artifacts/bin/gatelane-${os}-${arch}.tar.gz" "gatelane-${os}-${arch}"
            fi
          done

      # A bundle that cannot start is worse than no bundle. Run it here.
      - name: Verify the bundled CLI runs
        run: |
          set -euo pipefail
          bin="artifacts/bin/gatelane-linux-amd64/gatelane"
          node "$bin" --help
          # The mock provider exercises the full gate path (replay -> judge ->
          # compare -> sign) without an API key, so a broken bundle fails
          # here instead of in a user's terminal.
          node "$bin" gate \
            --candidate model:gpt-4o \
            --judges mock-judge \
            --provider mock \
            --judge-provider mock \
            --report /tmp/gatelane-smoke.json
          test -s /tmp/gatelane-smoke.json
          echo "bundled CLI produced a report"

      # Linux packaging is third-party and must not block the npm tarballs
      # from being attached to the release.
      - name: Build Linux .deb and .rpm
        run: |
          set -euo pipefail
          VERSION="${{ steps.tag.outputs.value }}"

          # nfpm is a single static Go binary — no Docker, no Debian build
          # environment. The previous `jiro4989/build-deb-action` could not
          # produce an rpm at all (it silently emitted a second .deb) and
          # ignored several of the inputs it was given.
          curl -sSL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz"
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          chmod +x /tmp/nfpm

          for arch in amd64 arm64; do
            export NFPM_VERSION="$VERSION"
            export NFPM_ARCH="$arch"
            case "$arch" in
              amd64) deb_arch=amd64; rpm_arch=x86_64 ;;
              arm64) deb_arch=arm64; rpm_arch=aarch64 ;;
            esac
            /tmp/nfpm package -f packaging/linux/nfpm.yaml -p deb \
              --target "artifacts/gatelane_${VERSION}_${deb_arch}.deb"
            /tmp/nfpm package -f packaging/linux/nfpm.yaml -p rpm \
              --target "artifacts/gatelane-${VERSION}-1.${rpm_arch}.rpm"
          done
          ls -la artifacts/*.deb artifacts/*.rpm
      - name: Stage all artifacts
        run: |
          mkdir -p artifacts/final
          cp -v artifacts/./*.tgz artifacts/final/ || true
          cp -v artifacts/bin/./*.tar.gz artifacts/final/ || true
          cp -v artifacts/bin/./*.zip  artifacts/final/ || true
          cp -v artifacts/./*.deb artifacts/final/ || true
          cp -v artifacts/./*.rpm artifacts/final/ || true
          ls -la artifacts/final

      - name: Generate SHA256SUMS
        run: |
          cd artifacts/final
          # Exclude SHA256SUMS itself — the redirect creates the file before
          # the glob is expanded, so it would otherwise hash an empty file.
          ls | grep -v '^SHA256SUMS$' | xargs sha256sum -- > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS (cosign keyless)
        run: |
          cosign sign-blob --yes \
            --output-signature artifacts/final/SHA256SUMS.sig \
            --bundle artifacts/final/SHA256SUMS.bundle \
            artifacts/final/SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gatelane-release-artifacts
          path: artifacts/final/

  # ----------------------------------------------------------------------
  # 2. Publish Docker image (multi-arch)
  # ----------------------------------------------------------------------
  docker:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # push the image to ghcr.io
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          SHORT="${TAG#v}"
          if [ "$TAG" = "main" ] || echo "$TAG" | grep -q "/"; then
            # branch push or non-tag → use sha
            SHORT="${SHORT}-${GITHUB_SHA::7}"
          fi
          {
            echo "tag=${TAG}"
            echo "short=${SHORT}"
            echo "platform=${{ matrix.platform }}"
          } >> "$GITHUB_OUTPUT"

      - name: Build + push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/gatelane:${{ steps.meta.outputs.short }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/gatelane:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.title=gatelane
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0

  # ----------------------------------------------------------------------
  # 3. Attach everything to the GitHub Release
  # ----------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # create the release and upload its assets
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gatelane-release-artifacts
          path: artifacts/

      - name: Create / update release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: gatelane ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.tgz
            artifacts/bin/*.tar.gz
            artifacts/bin/*.zip
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/SHA256SUMS
            artifacts/SHA256SUMS.sig
            artifacts/SHA256SUMS.bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ----------------------------------------------------------------------
  # 4. Publish to npm (trusted publishing via OIDC)
  # ----------------------------------------------------------------------
  npm:
    name: Publish to npm
    needs: build
    # Skipped (visible in the UI) until the npm org, token and variable
    # exist. Packaging and GitHub Release assets do not depend on this, so
    # tagging still produces installable tarballs without npm credentials.
    if: vars.ENABLE_NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm's OIDC trusted publishing
      id-token: write
    environment:
      name: npm-publish
      url: https://www.npmjs.com/
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      # Node 24 is required: npm's OIDC trusted publishing needs npm
      # >= 11.5.1 and Node >= 22.14.0, and `npm dist-tag` over OIDC
      # needs npm >= 11.21.0.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
          # Never cache in a release build.
          package-manager-cache: false

      - name: Use an npm that supports OIDC
        run: npm install -g npm@^11.21.0

      - name: Install + build
        run: |
          pnpm install --frozen-lockfile
          pnpm -r --filter "./packages/*" build

      - name: Resolve version
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Publishing version ${TAG#v}"

      - name: Stamp version
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          for pkg in packages/gatelane-sdk packages/gatelane-engine packages/source-prod-slice packages/cli packages/ci-adapter; do
            node -e "const p=require('./${pkg}/package.json');p.version='${VERSION}';require('fs').writeFileSync('./${pkg}/package.json',JSON.stringify(p,null,2)+'\n');"
          done

      # Guard rail: a pre-release version must never be published to latest.
      - name: Verify version is a stable semver
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          if echo "$VERSION" | grep -qE '(^v|-|dev|alpha|beta|canary|rc)'; then
            echo "::error::Refusing to publish '${VERSION}' to the latest tag."
            exit 1
          fi

      # `npm publish` publishes the manifest verbatim — it does not
      # rewrite `workspace:*` the way `pnpm publish` does. Resolve the
      # workspace ranges ourselves so the published manifest points at
      # real versions.
      - name: Resolve workspace dependencies
        run: node tools/resolve-workspace-deps.mjs

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.value }}"
          # Dependency order: sdk -> engine -> source-prod-slice -> cli -> ci-adapter
          for pkg in \
            packages/gatelane-sdk \
            packages/gatelane-engine \
            packages/source-prod-slice \
            packages/cli \
            packages/ci-adapter; do
            name="$(node -p "require('./${pkg}/package.json').name")"
            echo "::group::publishing ${name}@${VERSION}"

            # Skip if this exact version is already on the registry.
            if [ "$(npm view "${name}@${VERSION}" version 2>/dev/null || true)" = "$VERSION" ]; then
              echo "${name}@${VERSION} is already published, skipping"
              echo "::endgroup::"
              continue
            fi

            # The npm registry returns 503 under load, which would
            # otherwise abort the whole release on a transient failure.
            attempt=1
            until (cd "$pkg" && npm publish --tag latest --access public --provenance); do
              if [ "$attempt" -ge 5 ]; then
                echo "::error::failed to publish ${name}@${VERSION} after ${attempt} attempts"
                exit 1
              fi
              echo "::warning::publishing ${name}@${VERSION} failed, retrying (${attempt}/5)"
              attempt=$((attempt + 1))
              sleep $((attempt * 20))
            done
            echo "::endgroup::"
          done

      # This needs the "Allow npm dist-tag" option on the trusted
      # publisher, so a failure here is reported but does not fail the
      # release — the packages themselves are already published.
      - name: Apply dist-tags
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.value }}"
          for pkg in \
            packages/gatelane-sdk \
            packages/gatelane-engine \
            packages/source-prod-slice \
            packages/cli \
            packages/ci-adapter; do
            name="$(node -p "require('./${pkg}/package.json').name")"
            node tools/npm-dist-tags.mjs "$name" "$VERSION" latest \
              || echo "::warning::could not manage the dist-tags of ${name}; enable 'Allow npm dist-tag' on the trusted publisher"
          done

      # The registry answers a fresh publish with "Your package is being
      # processed and may take a few minutes to become available", so the
      # version is not readable immediately. Poll instead of failing on
      # the first 404.
      - name: Verify the packages are actually on the registry
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.value }}"
          for name in \
            @lanefoundry/gatelane-sdk \
            @lanefoundry/gatelane-engine \
            @lanefoundry/source-prod-slice \
            @lanefoundry/gatelane-cli \
            @lanefoundry/gatelane-ci-adapter; do
            published=""
            for attempt in $(seq 1 24); do
              published="$(npm view "${name}@${VERSION}" version 2>/dev/null || true)"
              [ "$published" = "$VERSION" ] && break
              echo "attempt ${attempt}: ${name}@${VERSION} is '${published}', waiting for the registry"
              sleep 15
            done
            echo "${name}@${VERSION} -> ${published}"
            if [ "$published" != "$VERSION" ]; then
              echo "::error::${name}@${VERSION} is ${published}, expected ${VERSION}"
              exit 1
            fi
            echo "${name} dist-tags: $(npm view "${name}" dist-tags --json 2>/dev/null || echo '{}')"
          done

  # ----------------------------------------------------------------------
  # 5. Publish Python SDK to PyPI (trusted publishing via OIDC)
  # ----------------------------------------------------------------------
  pypi:
    name: Publish to PyPI
    needs: build
    if: vars.ENABLE_PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # PyPI trusted publishing via OIDC
      id-token: write
    environment:
      name: pypi-publish
      url: https://pypi.org/project/gatelane-sdk/
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Install JS deps + build SDK so Python can grab types
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @lanefoundry/gatelane-sdk build

      # The checked-in version is a `-dev` placeholder. Stamp the release
      # version explicitly instead of relying on a VCS-derived version,
      # which silently kept publishing 0.0.1-dev.
      - name: Stamp version
        working-directory: packages/gatelane-sdk-py
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          sed -i -E "s/^version = \".*\"/version = \"${VERSION}\"/" pyproject.toml
          grep -E '^version = ' pyproject.toml

      - name: Build Python wheel + sdist
        working-directory: packages/gatelane-sdk-py
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish with trusted publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1