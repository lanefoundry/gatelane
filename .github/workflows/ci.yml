name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  sdk-parity:
    name: SDK parity drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-sdk-parity.mjs

  python-sdk:
    name: Python SDK lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: packages/gatelane-sdk-py/pyproject.toml
      - name: Install SDK + dev deps
        working-directory: packages/gatelane-sdk-py
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        working-directory: packages/gatelane-sdk-py
        run: ruff check src tests
      - name: Typecheck
        working-directory: packages/gatelane-sdk-py
        run: mypy src/gatelane_sdk
      - name: Test
        working-directory: packages/gatelane-sdk-py
        run: pytest
