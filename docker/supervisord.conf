[supervisord]
nodaemon=false
logfile=/var/log/supervisor/supervisord.log
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:gatelane-worker]
command=/usr/bin/env node /app/worker/worker-serve.mjs
directory=/app/worker
user=gatelane
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/worker.log
stderr_logfile=/var/log/supervisor/worker.err
environment=GATELANE_RUNTIME="container",GATELANE_WORKER_PORT="%(ENV_GATELANE_WORKER_PORT)s",GATELANE_CAPTURE_TOKEN="%(ENV_GATELANE_CAPTURE_TOKEN)s"

[program:gatelane-dashboard]
command=/usr/bin/env npx --yes serve -s /app/dashboard/dist -l tcp://0.0.0.0:%(ENV_GATELANE_DASHBOARD_PORT)s
directory=/app/dashboard
user=gatelane
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/dashboard.log
stderr_logfile=/var/log/supervisor/dashboard.err